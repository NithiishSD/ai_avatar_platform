[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar-platform-sdk"
version = "0.1.0"
description = "Python client for the AI Avatar Platform API: synthesise speech, render a lip-synced video, score it."
requires-python = ">=3.10"
# httpx is the only runtime dependency; the tests drive it through its MockTransport.
dependencies = ["httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["avatar_platform*"]
